    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws:;" />
    <script>
      (function() {
        function isWsError(err) {
          if (!err) return false;
          var msg = (err.message || String(err) || '').toLowerCase();
          return msg.indexOf('websocket') !== -1 || msg.indexOf('ws:') !== -1 || msg.indexOf('closed without opened') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason || event.detail);
          if (isWsError(reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var err = event && (event.error || event.message);
          if (isWsError(err)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
